<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fund Transfer - Apex Bank</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand">Apex<span>Bank</span></div>
      <ul class="nav-menu">
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="transfer.html" class="nav-link active">Transfers</a></li>
        <li><a href="transactions.html" class="nav-link">History</a></li>
        <li><a href="profile.html" class="nav-link">Profile</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <h2 style="margin-bottom:24px;">Transfer Funds</h2>
      <div class="glass-panel" style="max-width:600px; padding:32px;">
        <form id="transferForm">
          <div class="form-group">
            <label>From Account</label>
            <input type="text" id="sourceAccount" class="form-control" placeholder="Source Account Number" required>
          </div>
          <div class="form-group">
            <label>Recipient Account Number</label>
            <input type="text" id="targetAccount" class="form-control" placeholder="Target Account Number" required>
          </div>
          <div class="form-group">
            <label>Amount ($)</label>
            <input type="number" id="amount" class="form-control" placeholder="0.00" step="0.01" required>
          </div>
          <div class="form-group">
            <label>Note / Reference</label>
            <input type="text" id="note" class="form-control" placeholder="Payment for...">
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:16px;">Send Transfer</button>
        </form>
      </div>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/transfer.js"></script>
</body>
</html>
