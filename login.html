<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Apex Bank</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="glow-bg"></div>
    <div class="glass-panel auth-card animate-fade-in">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p style="color:var(--text-muted); font-size:0.9rem;">Access your secure banking dashboard</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Sign In</button>
      </form>
      <p style="text-align:center; margin-top:20px; font-size:0.875rem; color:var(--text-muted);">
        Don't have an account? <a href="register.html" class="auth-link">Register</a>
      </p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
